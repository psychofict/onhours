<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>A street group chat (drawn for the video; every name is made up)</title>
<link rel="stylesheet" href="/base.css">
<style>
  html, body { width: 390px; height: 844px; overflow: hidden; background: #F4EEE3; }
  #chat { position: absolute; inset: 0; transform-origin: 38% 30%; animation: lens 3.2s var(--ease) 5.6s both; }
  header { position: absolute; top: 0; left: 0; right: 0; height: 74px; padding: 14px 16px 0; display: flex; align-items: center; gap: 12px; background: #fff; border-bottom: 1px solid var(--hair); z-index: 3; }
  .back { width: 22px; height: 22px; fill: none; stroke: var(--stone); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .av { width: 40px; height: 40px; border-radius: 50%; background: var(--band); display: grid; place-items: center; font-weight: 600; font-size: 14px; color: #6A4A0C; }
  .who b { display: block; font-size: 16px; font-weight: 600; line-height: 1.2; } .who span { font-size: 12.5px; color: var(--ash); }
  .feed { position: absolute; top: 74px; bottom: 76px; left: 0; right: 0; padding: 16px 14px; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; }
  .msg { max-width: 82%; padding: 9px 12px 8px; border-radius: 6px 18px 18px 18px; background: #fff; border: 1px solid var(--hair); box-shadow: 0 6px 14px -10px rgba(60,40,10,.25); opacity: 0; transform: translateY(14px) scale(.98); animation: pop .6s var(--ease) both; font-size: 15.5px; line-height: 1.35; }
  .msg .n { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 2px; }
  .msg .t { display: block; margin-top: 3px; font-size: 11px; color: var(--ash); text-align: right; }
  .msg.photo { padding: 6px 6px 7px; width: 78%; }
  .msg.photo img { display: block; width: 100%; border-radius: 14px 14px 14px 14px; }
  .msg.photo .fw { display: block; padding: 2px 6px 6px; font-size: 12px; color: var(--ash); font-style: italic; }
  .a { animation-delay: .05s; } .b { animation-delay: .7s; } .c { animation-delay: 2.9s; } .d { animation-delay: 4.1s; } .e { animation-delay: 5.3s; }
  .typing { opacity: 0; width: 64px; padding: 10px 14px; display: flex; gap: 5px; animation: typing 1.2s linear 1.8s both; } .typing i { width: 7px; height: 7px; border-radius: 50%; background: #B7AF9F; animation: dot 1s infinite; } .typing i:nth-child(2) { animation-delay: .15s } .typing i:nth-child(3) { animation-delay: .3s }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 76px; padding: 12px 14px 22px; display: flex; gap: 10px; background: #fff; border-top: 1px solid var(--hair); z-index: 3; }
  .bar div { flex: 1; border: 1px solid var(--hair); border-radius: 999px; padding: 0 16px; line-height: 40px; color: var(--ash); font-size: 15px; background: #FCFAF5; }
  .bar i { width: 42px; height: 42px; border-radius: 50%; background: var(--band); }
  @keyframes pop { to { opacity: 1; transform: none; } }
  @keyframes typing { 0% { opacity: 0; transform: translateY(10px); } 15%, 85% { opacity: 1; transform: none; } 100% { opacity: 0; } }
  @keyframes dot { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  @keyframes lens { to { transform: scale(1.16) translateY(-2%); } }
</style></head><body>
<div id="chat">
  <header>
    <svg class="back" viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg>
    <div class="av">SR</div>
    <div class="who"><b>Siding Road neighbours</b><span>143 members</span></div>
  </header>
  <div class="feed">
    <div class="msg a"><span class="n" style="color:#8A4B05">Block 7 admin</span>Schedule for tomorrow. Please share.<span class="t">07:12</span></div>
    <div class="msg photo b"><span class="fw">Forwarded</span><img src="/app/sample-notice.jpg" alt="A printed power supply notice"><span class="t">07:12</span></div>
    <div class="msg typing"><i></i><i></i><i></i></div>
    <div class="msg c"><span class="n" style="color:#33452F">Mrs Banda</span>Which group are we??<span class="t">07:14</span></div>
    <div class="msg d"><span class="n" style="color:#5C3A8A">Tendai</span>I think group 2. Not sure.<span class="t">07:15</span></div>
    <div class="msg e"><span class="n" style="color:#8A4B05">Block 7 admin</span>Pump or iron first?<span class="t">07:16</span></div>
  </div>
  <div class="bar"><div>Message</div><i></i></div>
</div>
</body></html>
