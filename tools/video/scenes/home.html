<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>A phone home screen (drawn for the video; no real brands)</title>
<link rel="stylesheet" href="/base.css">
<style>
  /* The story, 4.2 s after body.go: an "Add to home screen" prompt, the icon appears, a tap, the app opens. */
  html, body { width: 390px; height: 844px; overflow: hidden; background: linear-gradient(170deg, #F9F0DC 0%, #F1E7D3 55%, #E9DFCB 100%); }
  .grid { position: absolute; left: 22px; right: 22px; top: 70px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 26px 14px; }
  .app { display: grid; justify-items: center; gap: 7px; font-size: 12px; font-weight: 500; color: var(--stone); height: 90px; align-content: start; }
  .app i { display: grid; place-items: center; width: 66px; height: 66px; border-radius: 18px; background: var(--c); box-shadow: 0 8px 14px -10px rgba(60,40,10,.35); }
  .app svg { width: 30px; height: 30px; fill: none; stroke: var(--g); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .dock { position: absolute; left: 18px; right: 18px; bottom: 26px; height: 96px; border-radius: 30px; background: rgba(255,255,255,.55); border: 1px solid rgba(255,255,255,.7); display: flex; justify-content: space-around; align-items: center; padding: 0 12px; }
  .dock i { display: grid; place-items: center; width: 62px; height: 62px; border-radius: 17px; background: var(--c); }
  .dock svg { width: 28px; height: 28px; fill: none; stroke: var(--g); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

  /* the OnHours icon: not there until the prompt is answered */
  .mine { opacity: 0; transform: scale(.4); }
  .mine img { display: block; width: 66px; height: 66px; border-radius: 18px; box-shadow: 0 10px 18px -8px rgba(60,40,10,.55); }
  .label { opacity: 0; }
  .ring { position: absolute; left: 50%; top: 33px; width: 66px; height: 66px; margin: -33px 0 0 -33px; border-radius: 22px; box-shadow: 0 0 0 0 rgba(229,181,79,.7); opacity: 0; }

  /* the prompt */
  .scrim { position: absolute; inset: 0; background: rgba(247,241,232,.6); opacity: 0; }
  .sheet { position: absolute; left: 10px; right: 10px; bottom: 12px; padding: 22px 20px 20px; border-radius: 34px; background: #fff; box-shadow: 0 -10px 40px -10px rgba(80,52,8,.28), 0 0 0 1px rgba(28,27,26,.06); transform: translateY(170%); }
  .sheet .top { display: flex; gap: 14px; align-items: center; }
  .sheet img { width: 58px; height: 58px; border-radius: 16px; box-shadow: 0 8px 14px -8px rgba(60,40,10,.5); }
  .sheet h2 { margin: 0; font: 400 25px/1.1 "Newsreader", Georgia, serif; letter-spacing: -.01em; }
  .sheet p { margin: 4px 0 0; font-size: 14.5px; line-height: 1.4; color: var(--stone); }
  .sheet .btns { display: flex; gap: 10px; margin-top: 18px; }
  .sheet .btns b { flex: 1; display: grid; place-items: center; height: 50px; border-radius: 999px; font-weight: 600; font-size: 16px; background: var(--canvas); color: var(--stone); }
  .sheet .btns b.add { background: var(--blue); color: #fff; }

  /* the finger */
  .finger { position: absolute; left: 0; top: 0; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; background: rgba(255,255,255,.55); border: 2px solid rgba(28,27,26,.55); box-shadow: 0 4px 14px rgba(28,27,26,.25); opacity: 0; z-index: 5; }

  /* the app opening from its icon, into its own first screen */
  .open { position: absolute; left: 0; top: 0; width: 66px; height: 66px; border-radius: 18px; background: var(--canvas) center top / cover no-repeat; opacity: 0; transform-origin: 0 0; z-index: 4; }

  .go .scrim { animation: scrim 1.5s var(--ease) 0.05s both; }
  .go .sheet { animation: sheet 1.6s var(--ease) 0.05s both; }
  .go .sheet .add { animation: press .3s var(--ease) 1.05s both; }
  .go .mine { animation: pop .8s cubic-bezier(.34,1.56,.64,1) 1.55s both, press .4s var(--ease) 3.0s both; }
  .go .ring { animation: ring 1s ease-out 1.8s both; }
  .go .label { animation: fade .4s var(--ease) 1.7s both; }
  .go .finger { animation: finger 4.3s linear both; }
  .go .open { animation: open .8s var(--ease) 3.15s forwards; }

  @keyframes scrim { 0% { opacity: 0; } 12% { opacity: 1; } 85% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes sheet { 0% { transform: translateY(170%); } 22% { transform: none; } 82% { transform: none; } 100% { transform: translateY(170%); } }
  @keyframes press { 50% { transform: scale(.9); } 100% { transform: scale(1); } }
  @keyframes pop { 0% { opacity: 0; transform: scale(.4); } 100% { opacity: 1; transform: scale(1); } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes ring { 0% { opacity: 1; box-shadow: 0 0 0 0 rgba(229,181,79,.75); } 100% { opacity: 0; box-shadow: 0 0 0 26px rgba(229,181,79,0); } }
</style></head><body>
<div class="grid" id="grid"></div>
<div class="dock" id="dock"></div>
<div class="scrim"></div>
<div class="sheet" id="sheet">
  <div class="top"><img src="/app/icons/icon-192.png" alt=""><div><h2>Add OnHours to your home screen?</h2><p>It opens like an app, and works with no network.</p></div></div>
  <div class="btns"><b>Not now</b><b class="add" id="add">Add</b></div>
</div>
<div class="finger" id="finger"></div>
<div class="open" id="open" style="background-image:url(/work/hero-phone.png)"></div>
<script>
  const G = {
    camera: '<path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.4"/>',
    notes: '<rect x="5" y="4" width="14" height="16" rx="2"/><path d="M8.5 9h7M8.5 12.5h7M8.5 16h4"/>',
    clock: '<circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 2"/>',
    weather: '<circle cx="12" cy="12" r="3.6"/><path d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2M6 6l1.5 1.5M16.5 16.5L18 18M18 6l-1.5 1.5M7.5 16.5L6 18"/>',
    routes: '<path d="M12 20s6-5.6 6-10a6 6 0 0 0-12 0c0 4.4 6 10 6 10z"/><circle cx="12" cy="10" r="2.2"/>',
    gallery: '<rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4.5 17l4.5-4.5 3.5 3.5 2.5-2.5 4.5 4"/>',
    documents: '<path d="M7 4h7l4 4v12H7z"/><path d="M14 4v4h4M9.5 12h6M9.5 15.5h6"/>',
    songs: '<path d="M9 17V6l9-2v11"/><circle cx="7" cy="17.5" r="2"/><circle cx="16" cy="15.5" r="2"/>',
    calendar: '<rect x="4.5" y="6" width="15" height="13.5" rx="2"/><path d="M4.5 10.5h15M8.5 4v3.5M15.5 4v3.5"/>',
    radio: '<rect x="4" y="8" width="16" height="11" rx="2"/><circle cx="9" cy="13.5" r="2.4"/><path d="M14 12h3.5M14 15h3.5M7 8l9-4"/>',
    receipts: '<path d="M6.5 4h11v16l-2-1.4-1.8 1.4-1.7-1.4-1.7 1.4-1.8-1.4-2 1.4z"/><path d="M9.5 9h5M9.5 12.5h5"/>',
    recipes: '<path d="M5 11h14v2a6 6 0 0 1-6 6h-2a6 6 0 0 1-6-6z"/><path d="M9 8c0-1.5 1.5-1.5 1.5-3M13.5 8c0-1.5 1.5-1.5 1.5-3"/>',
  };
  const tile = (name, c, g, label) => `<div class="app"><i style="--c:${c};--g:${g}"><svg viewBox="0 0 24 24">${G[name]}</svg></i>${label}</div>`;
  const apps = [
    ["camera", "#E6D9BF", "#7A6330", "Camera"], ["notes", "#D8E0C9", "#4F6B45", "Notes"], ["clock", "#E9D3C6", "#8A4E36", "Clock"], ["weather", "#D5DDE6", "#3F6485", "Weather"],
    ["routes", "#EADFC4", "#80651F", "Routes"], ["gallery", "#DCD3E4", "#62507F", "Gallery"], ["documents", "#E2E0D6", "#5B5848", "Documents"], ["songs", "#E4D6D0", "#86503F", "Songs"],
    ["calendar", "#D7E2DC", "#3F6E5A", "Calendar"], ["radio", "#EBE3CF", "#7B6A2E", "Radio"], ["receipts", "#DFD8CA", "#5E5646", "Receipts"], ["recipes", "#E3DAD0", "#7B5A3E", "Recipes"],
  ];
  const grid = document.getElementById("grid");
  grid.innerHTML = apps.map((a) => tile(...a)).join("") +
    '<div class="app"></div><div class="app"><div class="mine" id="mine" style="position:relative"><img src="/app/icons/icon-192.png" alt=""><span class="ring"></span></div><span class="label" style="font-weight:600;color:var(--ink)">OnHours</span></div><div class="app"></div><div class="app"></div>';
  document.getElementById("dock").innerHTML = ["camera", "notes", "clock", "weather"].map((n, i) => { const a = apps[i]; return `<i style="--c:${a[1]};--g:${a[2]}"><svg viewBox="0 0 24 24">${G[n]}</svg></i>`; }).join("");

  // Where the finger goes: the Add button, then the OnHours icon. The tile that opens starts exactly over the icon.
  const mineEl = document.getElementById("mine");
  mineEl.style.transform = "none"; // measure the icon at full size, not in its "not yet" state
  const mine = mineEl.querySelector("img").getBoundingClientRect();
  mineEl.style.transform = "";
  const add = document.getElementById("add");
  // The sheet is off-screen until its animation runs; measure where the Add button will sit.
  const sheet = document.getElementById("sheet");
  sheet.style.transform = "none"; const a = add.getBoundingClientRect(); sheet.style.transform = "";
  const icon = { x: mine.left + mine.width / 2, y: mine.top + mine.height / 2 };
  const btn = { x: a.left + a.width / 2, y: a.top + a.height / 2 };
  const css = `
    @keyframes finger {
      0%   { opacity: 0; left: 300px; top: 760px; transform: scale(1); }
      12%  { opacity: 0; left: 300px; top: 760px; }
      20%  { opacity: 1; left: 300px; top: 760px; }
      24%  { opacity: 1; left: ${btn.x}px; top: ${btn.y}px; transform: scale(1); }
      26%  { left: ${btn.x}px; top: ${btn.y}px; transform: scale(.72); }
      30%  { opacity: 1; left: ${btn.x}px; top: ${btn.y}px; transform: scale(1); }
      36%  { opacity: 0; left: ${btn.x}px; top: ${btn.y}px; }
      60%  { opacity: 0; left: 300px; top: 560px; }
      64%  { opacity: 1; left: 300px; top: 560px; }
      69%  { opacity: 1; left: ${icon.x}px; top: ${icon.y}px; transform: scale(1); }
      71%  { opacity: 1; left: ${icon.x}px; top: ${icon.y}px; transform: scale(.72); }
      76%  { opacity: 0; left: ${icon.x}px; top: ${icon.y}px; transform: scale(1); }
      100% { opacity: 0; }
    }
    @keyframes open {
      0%   { opacity: 1; left: ${mine.left}px; top: ${mine.top}px; width: 66px; height: 66px; border-radius: 18px; }
      100% { opacity: 1; left: 0; top: 0; width: 390px; height: 844px; border-radius: 0; }
    }`;
  document.head.insertAdjacentHTML("beforeend", `<style>${css}</style>`);
  // The recorder starts the story: document.body.classList.add("go")
</script>
</body></html>
